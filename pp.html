<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>How many days until 20th February 2027</title>
  <style>
    :root{
      --text:#221438;
      --muted:rgba(34,20,56,.68);
      --card:rgba(255,255,255,.82);
      --card-border:rgba(255,255,255,.64);
      --shadow:0 24px 70px rgba(31,22,53,.14);
      --pink:#ff4d8d;
      --rose:#ff7ab6;
      --peach:#ffb6c9;
      --lav:#9f8cff;
      --gold:#ffd36a;
      --mint:#8ef0d0;
      --cream:#fffaf7;
      --ink:#5f3a77;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:var(--cream);
    }

    body{
      min-height:100vh;
      position:relative;
      isolation:isolate;
    }

    .bg{
      position:fixed;
      inset:0;
      z-index:-10;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,122,182,.44), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(159,140,255,.30), transparent 24%),
        radial-gradient(circle at 78% 80%, rgba(255,214,106,.20), transparent 28%),
        radial-gradient(circle at 16% 82%, rgba(142,240,208,.18), transparent 28%),
        linear-gradient(135deg,
          #fff7fb 0%,
          #fff2f8 16%,
          #fffaf2 34%,
          #fdf6ff 54%,
          #f6fffb 74%,
          #fff7fb 100%
        );
      background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%;
      animation:bgShift 18s ease-in-out infinite;
    }

    .bg::before,
    .bg::after{
      content:"";
      position:absolute;
      inset:-10%;
      pointer-events:none;
      filter:blur(60px);
      opacity:.9;
      mix-blend-mode:screen;
    }

    .bg::before{
      background:
        radial-gradient(circle at 20% 30%, rgba(255,77,141,.78), transparent 24%),
        radial-gradient(circle at 78% 20%, rgba(255,211,106,.70), transparent 24%),
        radial-gradient(circle at 35% 72%, rgba(159,140,255,.56), transparent 30%),
        radial-gradient(circle at 72% 76%, rgba(255,122,182,.66), transparent 28%);
      animation:floatA 16s ease-in-out infinite alternate;
    }

    .bg::after{
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.32), transparent 40%),
        radial-gradient(circle at 42% 56%, rgba(142,240,208,.32), transparent 28%),
        radial-gradient(circle at 64% 40%, rgba(255,182,201,.34), transparent 26%);
      animation:floatB 18s ease-in-out infinite alternate;
    }

    .grain{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      opacity:.12;
      background-image:
        linear-gradient(rgba(255,255,255,.44) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.24) 1px, transparent 1px);
      background-size:3px 3px,3px 3px;
      mix-blend-mode:soft-light;
      animation:grain 10s steps(8) infinite;
    }

    .page{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:16px 12px 34px;
      position:relative;
      z-index:2;
    }

    .top-note{
      position:relative;
      margin:6px auto 10px;
      width:fit-content;
      max-width:100%;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.66);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      color:#6b2d5c;
      font-weight:900;
      letter-spacing:.03em;
      text-align:center;
      transform-origin:center;
      animation:topNoteWiggle 2.6s ease-in-out infinite;
    }

    .top-note span{
      display:inline-block;
      animation:heartPulse 1.8s ease-in-out infinite;
      color:var(--pink);
      margin:0 3px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 2px 14px;
      border-bottom:1px solid rgba(31,22,53,.08);
      margin-bottom:16px;
    }

    .brand{
      font-size:12px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(31,22,53,.56);
    }

    .crumb{
      font-size:12px;
      color:rgba(31,22,53,.56);
      text-align:right;
      white-space:nowrap;
    }

    .hero{
      text-align:center;
      padding:12px 6px 6px;
      position:relative;
    }

    .eyebrow{
      display:inline-block;
      font-size:13px;
      color:rgba(31,22,53,.72);
      background:rgba(255,255,255,.60);
      border:1px solid var(--card-border);
      padding:8px 12px;
      border-radius:999px;
      margin-bottom:12px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      animation:floatChip 3.6s ease-in-out infinite;
    }

    .heading-wrap{
      position:relative;
      display:inline-block;
      padding:18px 18px 14px;
      margin:0 auto;
      max-width:100%;
    }

    .head-scribble{
      position:absolute;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.95;
      color:#5f3a77;
      filter:drop-shadow(0 4px 10px rgba(95,58,119,.10));
      animation:scribbleFloat 5.8s ease-in-out infinite;
      pointer-events:none;
    }

    .hs1{ left:-34px; top:-10px; width:120px; height:56px; color:#ff4d8d; }
    .hs2{ right:-28px; top:-14px; width:112px; height:50px; color:#9f8cff; animation-delay:-1s; }
    .hs3{ left:-24px; bottom:-14px; width:122px; height:54px; color:#ffd36a; animation-delay:-2s; }

    .tiny-note{
      position:absolute;
      font-weight:900;
      font-size:14px;
      color:#6b2d5c;
      text-shadow:0 1px 0 rgba(255,255,255,.5);
      animation:notePop 2.4s ease-in-out infinite;
      pointer-events:none;
    }

    .tn1{ left:-4px; top:10px; }
    .tn2{ right:10px; top:-2px; color:#ff4d8d; animation-delay:-.5s; }
    .tn3{ left:8px; bottom:-2px; color:#9f8cff; animation-delay:-1s; }
    .tn4{ right:-2px; bottom:10px; animation-delay:-1.4s; }
    .tn5{ left:50%; top:-18px; transform:translateX(-50%); color:#ffd36a; animation-delay:-.8s; }
    .tn6{ left:50%; bottom:-18px; transform:translateX(-50%); color:#ff7ab6; animation-delay:-1.2s; }

    h1{
      margin:0;
      font-size:clamp(2rem,7vw,4.25rem);
      line-height:1.02;
      letter-spacing:-.05em;
      color:#1f1635;
      text-shadow:0 1px 0 rgba(255,255,255,.5);
    }

    .date{
      margin-top:10px;
      font-size:clamp(1.05rem,4vw,1.35rem);
      color:var(--muted);
      font-weight:700;
    }

    .countdown-wrap{
      position:relative;
      margin-top:22px;
      padding:18px 0 8px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0 auto 14px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.70);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      color:#6b2d5c;
      font-weight:800;
      letter-spacing:.03em;
      position:relative;
      z-index:2;
      animation:badgeFloat 4s ease-in-out infinite;
    }

    .badge .mini-heart{
      color:var(--pink);
      font-size:14px;
      animation:heartPulse 1.8s ease-in-out infinite;
    }

    .frame{
      position:relative;
      max-width:980px;
      margin:0 auto;
      padding:8px 0 2px;
    }

    .scribbles{
      position:absolute;
      inset:-8px -8px -8px;
      pointer-events:none;
      z-index:0;
    }

    .scribble{
      position:absolute;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.95;
      filter:drop-shadow(0 6px 18px rgba(255,77,141,.12));
      animation:scribbleFloat 6s ease-in-out infinite;
    }

    .scribble.one{ left:-2%; top:0%; width:120px; height:72px; stroke:var(--pink); animation-delay:0s; }
    .scribble.two{ right:-1%; top:6%; width:110px; height:66px; stroke:var(--lav); animation-delay:-1.2s; }
    .scribble.three{ left:2%; bottom:0%; width:112px; height:70px; stroke:var(--gold); animation-delay:-2.1s; }
    .scribble.four{ right:1%; bottom:2%; width:130px; height:80px; stroke:var(--rose); animation-delay:-1.8s; }

    .doodle{
      position:absolute;
      font-size:22px;
      opacity:.92;
      user-select:none;
      animation:heartFloat 7s ease-in-out infinite;
      z-index:2;
    }

    .doodle.h1{ left:8%; top:-6px; color:var(--pink); }
    .doodle.h2{ right:9%; top:-2px; color:var(--lav); animation-delay:-1.7s; }
    .doodle.h3{ left:6%; bottom:-2px; color:var(--gold); animation-delay:-3s; }
    .doodle.h4{ right:7%; bottom:-4px; color:var(--rose); animation-delay:-2.2s; }

    .doodle.k1{ left:18%; top:14%; font-size:16px; color:var(--mint); animation-delay:-1s; }
    .doodle.k2{ right:18%; top:18%; font-size:16px; color:var(--gold); animation-delay:-2s; }
    .doodle.k3{ left:18%; bottom:14%; font-size:16px; color:var(--lav); animation-delay:-4s; }
    .doodle.k4{ right:18%; bottom:14%; font-size:16px; color:var(--pink); animation-delay:-5s; }

    .doodle.r1{ left:48%; top:-18px; font-size:18px; color:var(--gold); animation-delay:-0.5s; }
    .doodle.r2{ left:14%; top:34%; font-size:20px; color:var(--lav); animation-delay:-2.4s; }
    .doodle.r3{ right:14%; top:34%; font-size:20px; color:var(--pink); animation-delay:-3.3s; }
    .doodle.r4{ left:46%; bottom:-20px; font-size:18px; color:var(--mint); animation-delay:-1.1s; }

    .doodle.x1{ left:22%; top:6%; font-size:14px; color:#9b5bb0; animation-delay:-1.2s; }
    .doodle.x2{ right:22%; top:8%; font-size:14px; color:#d46b95; animation-delay:-2.2s; }
    .doodle.x3{ left:24%; bottom:8%; font-size:14px; color:#d46b95; animation-delay:-3.2s; }
    .doodle.x4{ right:24%; bottom:10%; font-size:14px; color:#9b5bb0; animation-delay:-4.1s; }

    .arrow{
      position:absolute;
      width:84px;
      height:36px;
      stroke:var(--ink);
      stroke-width:3.5;
      fill:none;
      opacity:.72;
      filter:drop-shadow(0 4px 10px rgba(95,58,119,.10));
      animation:arrowWiggle 4s ease-in-out infinite;
      z-index:2;
    }

    .arrow.a1{ left:2%; top:18%; transform:rotate(-10deg); }
    .arrow.a2{ right:2%; top:20%; transform:scaleX(-1) rotate(-12deg); animation-delay:-1s; }
    .arrow.a3{ left:2%; bottom:16%; transform:rotate(10deg); animation-delay:-2s; }
    .arrow.a4{ right:2%; bottom:18%; transform:scaleX(-1) rotate(8deg); animation-delay:-3s; }

    .countdown{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      max-width:980px;
      margin:0 auto;
    }

    .box{
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:22px;
      padding:18px 10px 14px;
      text-align:center;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transform:translateZ(0);
      transition:transform 220ms ease, box-shadow 220ms ease;
      position:relative;
      overflow:hidden;
      min-height:120px;
    }

    .box::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,122,182,.12), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(159,140,255,.10), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(255,211,106,.10), transparent 32%);
      opacity:.8;
      pointer-events:none;
    }

    .box:hover{
      transform:translateY(-3px);
      box-shadow:0 30px 80px rgba(31,22,53,.16);
    }

    .num{
      position:relative;
      z-index:1;
      font-size:clamp(2.2rem,9vw,4.8rem);
      font-weight:900;
      line-height:1;
      letter-spacing:-.07em;
      color:#1f1635;
    }

    .label{
      position:relative;
      z-index:1;
      margin-top:9px;
      font-size:11px;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(31,22,53,.56);
    }

    .info{
      margin:20px auto 0;
      max-width:980px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }

    .panel{
      border:1px solid var(--card-border);
      border-radius:22px;
      padding:16px 14px 14px;
      background:rgba(255,255,255,.65);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .panel h2{
      margin:0 0 6px;
      font-size:15px;
      letter-spacing:-.02em;
    }

    .panel p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:13px;
    }

    .exact{
      font-weight:800;
      color:var(--text);
    }

    .footer{
      margin-top:22px;
      text-align:center;
      color:rgba(31,22,53,.72);
      font-size:13px;
      font-weight:600;
      background:rgba(255,255,255,.48);
      border:1px solid rgba(255,255,255,.44);
      border-radius:999px;
      padding:9px 14px;
      display:inline-block;
      left:50%;
      position:relative;
      transform:translateX(-50%);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      animation:badgeFloat 4s ease-in-out infinite;
    }

    .floating-heart{
      position:fixed;
      left:0;
      top:0;
      font-size:18px;
      pointer-events:none;
      z-index:3;
      opacity:.9;
      animation:rise 8s linear infinite;
      filter:drop-shadow(0 8px 14px rgba(255,77,141,.15));
    }

    .floating-heart:nth-child(1){ color:var(--pink); animation-duration:9s; animation-delay:0s; }
    .floating-heart:nth-child(2){ color:var(--lav); animation-duration:10s; animation-delay:-2s; }
    .floating-heart:nth-child(3){ color:var(--gold); animation-duration:11s; animation-delay:-4s; }
    .floating-heart:nth-child(4){ color:var(--rose); animation-duration:12s; animation-delay:-6s; }
    .floating-heart:nth-child(5){ color:var(--mint); animation-duration:9.5s; animation-delay:-3s; }

    .ring{
      position:absolute;
      width:22px;
      height:22px;
      border-radius:50%;
      border:2px solid rgba(255,122,182,.85);
      box-shadow:0 0 0 4px rgba(255,255,255,.18);
      animation:ringSpin 6s linear infinite;
      opacity:.9;
      z-index:2;
    }

    .ring::after{
      content:"";
      position:absolute;
      width:9px;
      height:9px;
      border-radius:50%;
      right:-3px;
      top:-3px;
      background:var(--gold);
      box-shadow:0 0 12px rgba(255,211,106,.6);
    }

    .ring.r1{ left:3%; top:12%; }
    .ring.r2{ right:5%; top:14%; border-color:rgba(159,140,255,.85); animation-delay:-1.4s; }
    .ring.r3{ left:8%; bottom:14%; border-color:rgba(255,214,106,.9); animation-delay:-2.7s; }
    .ring.r4{ right:7%; bottom:16%; border-color:rgba(142,240,208,.9); animation-delay:-4s; }

    .sparkle{
      position:absolute;
      color:var(--gold);
      font-size:16px;
      opacity:.92;
      animation:sparklePulse 2.8s ease-in-out infinite;
      text-shadow:0 0 12px rgba(255,211,106,.5);
      user-select:none;
      z-index:2;
    }

    .sparkle.s1{ left:12%; top:8%; animation-delay:0s; }
    .sparkle.s2{ right:12%; top:10%; color:var(--lav); animation-delay:-1.1s; }
    .sparkle.s3{ left:10%; bottom:10%; color:var(--mint); animation-delay:-2.2s; }
    .sparkle.s4{ right:10%; bottom:12%; color:var(--rose); animation-delay:-1.6s; }
    .sparkle.s5{ left:50%; top:4%; transform:translateX(-50%); animation-delay:-0.4s; }

    @keyframes bgShift{
      0%{ background-position:0% 50%,50% 50%,50% 50%,50% 50%,0% 0%; }
      50%{ background-position:100% 50%,55% 45%,45% 55%,60% 40%,100% 100%; }
      100%{ background-position:0% 50%,50% 50%,50% 50%,50% 50%,0% 0%; }
    }

    @keyframes floatA{
      from{ transform:translate3d(0,0,0) scale(1); }
      to{ transform:translate3d(8vw,-4vh,0) scale(1.1); }
    }

    @keyframes floatB{
      from{ transform:translate3d(0,0,0) scale(1); }
      to{ transform:translate3d(-7vw,5vh,0) scale(1.08); }
    }

    @keyframes grain{
      0%{ transform:translate(0,0); }
      20%{ transform:translate(-2%,1%); }
      40%{ transform:translate(1%,-2%); }
      60%{ transform:translate(2%,2%); }
      80%{ transform:translate(-1%,2%); }
      100%{ transform:translate(0,0); }
    }

    @keyframes scribbleFloat{
      0%,100%{ transform:translateY(0) rotate(0deg); }
      50%{ transform:translateY(-6px) rotate(1.2deg); }
    }

    @keyframes heartFloat{
      0%,100%{ transform:translateY(0) scale(1); opacity:.68; }
      50%{ transform:translateY(-8px) scale(1.06); opacity:1; }
    }

    @keyframes rise{
      0%{
        transform:translate3d(var(--x), 110vh, 0) scale(.9) rotate(0deg);
        opacity:0;
      }
      10%{ opacity:.9; }
      100%{
        transform:translate3d(calc(var(--x) + 30px), -20vh, 0) scale(1.25) rotate(18deg);
        opacity:0;
      }
    }

    @keyframes pulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.18); }
    }

    @keyframes ringSpin{
      0%{ transform:rotate(0deg) scale(1); }
      50%{ transform:rotate(180deg) scale(1.06); }
      100%{ transform:rotate(360deg) scale(1); }
    }

    @keyframes sparklePulse{
      0%,100%{ transform:scale(.9) rotate(0deg); opacity:.7; }
      50%{ transform:scale(1.18) rotate(14deg); opacity:1; }
    }

    @keyframes arrowWiggle{
      0%,100%{ transform:translateY(0) rotate(0deg); }
      50%{ transform:translateY(-4px) rotate(2deg); }
    }

    @keyframes topNoteWiggle{
      0%,100%{ transform:rotate(-1deg) scale(1); }
      50%{ transform:rotate(1deg) scale(1.02); }
    }

    @keyframes badgeFloat{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-3px); }
    }

    @keyframes floatChip{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-2px); }
    }

    @media (max-width:820px){
      .countdown{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
      .info{
        grid-template-columns:1fr 1fr;
      }
    }

    @media (max-width:520px){
      .page{
        padding:12px 8px 26px;
      }

      .top-note{
        font-size:12px;
        padding:9px 12px;
        line-height:1.25;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:6px;
        margin-bottom:12px;
      }

      .crumb{
        text-align:left;
      }

      .hero{
        padding:10px 2px 4px;
      }

      .eyebrow{
        font-size:12px;
        padding:7px 11px;
      }

      .heading-wrap{
        padding:22px 8px 18px;
      }

      .head-scribble{
        opacity:1;
      }

      .hs1{
        left:-18px;
        top:-16px;
        width:96px;
        height:44px;
      }

      .hs2{
        right:-16px;
        top:-18px;
        width:92px;
        height:42px;
      }

      .hs3{
        left:-14px;
        bottom:-18px;
        width:98px;
        height:44px;
      }

      .tiny-note{
        font-size:12px;
      }

      .tn1{ left:-2px; top:2px; }
      .tn2{ right:2px; top:-8px; }
      .tn3{ left:2px; bottom:-8px; }
      .tn4{ right:-2px; bottom:2px; }
      .tn5{ top:-22px; }
      .tn6{ bottom:-22px; }

      h1{
        font-size:clamp(1.9rem,11vw,3rem);
      }

      .date{
        font-size:clamp(1rem,4.2vw,1.15rem);
      }

      .countdown-wrap{
        margin-top:16px;
        padding:10px 0 4px;
      }

      .badge{
        font-size:12px;
        padding:9px 12px;
      }

      .scribbles{
        inset:-6px -4px -4px;
      }

      .scribble.one{ left:-6px; top:-2px; width:92px; height:54px; }
      .scribble.two{ right:-6px; top:0; width:88px; height:52px; }
      .scribble.three{ left:-6px; bottom:-2px; width:90px; height:54px; }
      .scribble.four{ right:-6px; bottom:-2px; width:94px; height:56px; }

      .doodle{ font-size:18px; }
      .doodle.k1,.doodle.k2,.doodle.k3,.doodle.k4{ font-size:13px; }
      .doodle.r1,.doodle.r2,.doodle.r3,.doodle.r4{ font-size:14px; }
      .doodle.x1,.doodle.x2,.doodle.x3,.doodle.x4{ font-size:12px; }

      .sparkle{ font-size:13px; }
      .sparkle.s1{ left:8%; top:4%; }

    }

    @media (prefers-reduced-motion: reduce){

      .sparkle,.ring,.arrow,.top-note,.badge,.eyebrow,.footer{

  <script>
    function ordinal(n){
      const s = ["th","st","nd","rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    const targetDate = new Date(2027, 1, 20, 0, 0, 0);
    document.getElementById("prettyDate").textContent = `${ordinal(20)} February 2027`;

    function updateCountdown(){
      const now = new Date();
      const diff = targetDate.getTime() - now.getTime();

      if(diff <= 0){
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.getElementById("exactDays").textContent = "0";
        document.getElementById("daysLabel").textContent = "Days";
        document.getElementById("statusText").textContent = "The date has arrived.";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = String(hours).padStart(2,"0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
      document.getElementById("exactDays").textContent = days;
      document.getElementById("daysLabel").textContent = days === 1 ? "Day" : "Days";
      document.getElementById("statusText").textContent = "Counting down now.";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const hearts = Array.from(document.querySelectorAll(".floating-heart"));
    const slots = hearts.map((_, i) => ({ x: 6 + i * 18 + Math.random() * 5 }));

    function animateHearts(){
      const t = performance.now() * 0.001;
      hearts.forEach((el, i) => {
        const x = slots[i].x + Math.sin(t * 0.7 + i) * 2;
        el.style.setProperty("--x", x + "vw");
      });
      requestAnimationFrame(animateHearts);
    }
    requestAnimationFrame(animateHearts);
  </script>
